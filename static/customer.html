async function navigate(p){if(busy)return;if(activeCellEdit&&!activeCellEdit.finish())return;detailDraftIndex=null;if(dirty&&!confirm('草稿尚未保存，确定离开？'))return;dirty=false;editing=null;editor=null;page=p;try{if(page==='forecast')await loadRecords();await render()}catch(e){toast(e.message)}}

function renderForecast(){const drafts=records.filter(r=>r.status==='draft'),submitted=records.filter(r=>r.status==='submitted'||r.status==='void'),rows=listTab==='draft'?drafts:submitted;document.getElementById('app').innerHTML=`<div class="heading"><div><h1>预报管理</h1><div class="muted">准备货物资料，核对无误后提交正式预报。</div></div><div class="row"><button class="secondary" onclick="navigate('forecast')">刷新</button><button onclick="newDraft()">＋ 新建预报</button></div></div><div class="tabs"><button class="${listTab==='draft'?'active':''}" onclick="listTab='draft';render()">草稿（${drafts.length}）</button><button class="${listTab==='submitted'?'active':''}" onclick="listTab='submitted';render()">已提交（${submitted.length}）</button></div><div class="card"><div class="scroll"><table><thead><tr><th>柜号</th><th>货物票数</th><th>总件数</th><th>${listTab==='draft'?'最近保存':'提交时间'}</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.code||'未填写柜号')}</td><td>${r.rows.length}</td><td>${qty(r.rows)}</td><td>${format(r.time)}</td><td><span class="badge ${r.status==='submitted'?'locked':''}">${r.status==='draft'?'草稿':r.status==='void'?'已作废':'已提交 · 已锁定'}</span></td><td><button class="link" onclick="openRecord('${r.id}')">${r.status==='draft'?'编辑':'查看'}</button>${r.status==='draft'?`<button class="link" onclick="submitSaved('${r.id}')">提交</button><button class="link" style="color:#b04444" onclick="removeDraft('${r.id}')">删除</button>`:''}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">暂无记录</div>'}</div></div><p class="notice">草稿仅本公司账号可见，不计入正式预报；正式提交后无法修改或删除。</p>`}

function renderEditor(){const locked=editor.status!=='draft';document.getElementById('app').innerHTML=`<div class="crumb">预报管理 / ${locked?'预报详情':'编辑草稿'}</div><div class="heading"><div><div class="row"><h1>${locked?'正式预报详情':'编辑预报草稿'}</h1><span class="badge ${locked?'locked':''}">${editor.status==='void'?'已作废':locked?'已提交 · 已锁定':'草稿'}</span></div><div class="muted">${editor.status==='void'?'该货柜已由公司端作废，仅保留历史预报，不可修改或再次提交。':locked?'预报已锁定，如需更正请联系仓库工作人员。':'正式提交后，预报资料将锁定，无法修改或删除。'}</div></div><button class="secondary" onclick="navigate('forecast')">← 返回列表</button></div><div class="steps"><div><b>1</b>填写柜号</div><div><b>2</b>上传预报</div><div class="on"><b>3</b>核对并提交</div></div><div class="card"><h2>基本信息</h2><div class="row" style="margin-top:20px"><label class="field"><span>所属公司（自动识别）</span><input disabled value="${esc(profile.company.name)}"></label><label class="field"><span>柜号 *</span><input id="code" maxlength="120" ${locked?'disabled':''} value="${esc(editor.code)}" placeholder="请输入柜号，例如 OOLU9472480" oninput="editor.code=this.value;dirty=true"></label></div></div><div class="card"><h2>预报文件</h2><div class="upload"><div class="row"><span class="fileicon">EXCEL</span><div><strong>${esc(editor.file||'请上传 Excel 预报表')}</strong><p class="muted" style="margin:6px 0 0">${editor.rows.length?'已解析 · '+editor.rows.length+'票货物，共'+qty(editor.rows)+'件':'支持 .xlsx / .xls，合并单元格下逐件读取重量、长宽高'}</p></div></div>${locked?'':`<button class="secondary" onclick="pickFile()">${editor.file?'替换文件':'选择 Excel'}</button>`}</div></div><div class="card"><div class="row between"><h2>货物资料核对</h2><span class="muted">${locked?'点击客户单号查看详情':'双击业务内容修改；点击“查看详情”编辑全部收件资料及分件尺寸'}</span></div><div style="margin-top:20px">${editor.rows.length?tableRows(editor.rows,'editor'):'<div class="empty">上传预报文件后，将在这里显示解析结果。</div>'}</div><div class="hint">${locked?'正式预报已提交。此页面只读，不提供修改或删除入口。':'草稿所有业务资料均可双击修改，Enter确认、Esc取消；修改后请保存。备注填写“扣货”可同步公司端扣货提醒。正式提交后全部锁定。'}</div></div><div class="footer"><span class="muted">${locked?'提交时间：'+format(ed async function saveDraftData(){flushDraftCell();if(!editor||editor.status!=='draft')throw Error('正式预报不可修改');const saved=mapForecast(await api('/api/client/forecasts/'+editor.id,{method:'PATCH',body:JSON.stringify({code:editor.code,filename:editor.file,source_id:editor.source_id||null,rows:editor.rows,revision:editor.revision})}));editor=saved;editing=saved.id;const i=records.findIndex(r=>r.id===saved.id);if(i>=0)records[i]=saved;else records.push(saved);dirty=false;return saved}

p(r=>`<p>第${r.cycle}轮 · ${r.quantity}件 · ${esc(r.damage_choice)} ${r.repaired_at?'· 已修复':''}</p>`).join('')||'<p class="muted">暂无记录</p>'}<h3>现场照片</h3><div class="row">${details.photos.map(p=>`<a href="/api/client/photos/${p.id}" target="_blank" rel="noopener"><img src="/api/client/photos/${p.id}" alt="现场照片" style="width:100px;height:100px;object-fit:cover;border-radius:8px"></a>`).join('')||'<p class="muted">暂无照片</p>'}</div><h3>入库 / 出库时间</h3>${details.events.map(e=>`<p>${esc(e.kind)} · ${formatTime(e.event_time)}</p>`).join('')||'<p class="muted">暂无时间记录</p>'}`:''}`;const modal=document.getElementById('modal');if(!modal.open)modal.showModal()}catch(e){toast(e.message)}}

let activeCellEdit=null,detailDraftIndex=null;
const draftFields={system_no:'客户单号',main_barcode:'客户唛头',transfer_no:'新标签',channel:'渠道',recipient:'收件人姓名',company:'公司',phone:'联系电话',email:'邮箱',country:'国家',postcode:'邮编',city:'城市',address:'地址',expected:'件数',declared_value:'货值',description:'物品描述',remark:'备注'};
const pieceFields=['weight','length','width','height'];
function canEditDraft(source){return source==='editor'&&editor?.status==='draft'}
function draftCell(source,index,key,value,piece=-1){const label=piece<0?draftFields[key]:({weight:'重量',length:'长',width:'宽',height:'高'})[key];const editable=canEditDraft(source)&&!!label;return `<td ${editable?`class="editable-cell" data-draft-row="${index}" data-draft-key="${key}" data-draft-piece="${piece}" tabindex="0" title="双击修改${label}；Enter确认，Esc取消" ondblclick="beginCellEdit(this,${index},'${key}',${piece})" onkeydown="if(event.key==='Enter'){event.preventDefault();beginCellEdit(this,${index},'${key}',${piece})}"`:''}>${key==='remark'&&String(value||'').includes('扣货')?'<b style="color:#b42318">'+esc(value)+'</b>':esc(value===null||value===undefined||value===''?(editable?'双击填写':'—'):value)}</td>`}
function changeDraftValue(index,key,piece,text){
 if(editor?.status!=='draft')throw Error('正式预报已锁定，不可修改');
 const row=editor.rows[index];if(!row)throw Error('订单不存在');
 if(piece>=0&&!pieceFields.includes(key)||piece<0&&!Object.hasOwn(draftFields,key))throw Error('该字段不可修改');
 let value=text.trim();
 if(key==='expected'){
  const n=Number(value);if(!value||!Number.isInteger(n)||n<1||n>5000)throw Error('件数必须为1至5000的整数');
  const excess=(row.pieces||[]).slice(n);if(excess.some(p=>pieceFields.some(k=>p[k]!==null&&p[k]!==undefined&&p[k]!=='')))throw Error('多余分件仍有重量或尺寸，请先核对并清空对应分件资料，再减少件数');
  row.pieces=(row.pieces||[]).slice(0,n);value=n;
 }else if(piece>=0||key==='declared_value'){
  value=value===''?null:Number(value);if(value!==null&&(!Number.isFinite(value)||value<0))throw Error('请输入有效非负数字，留空表示未知');
 }else{
  const max=key==='system_no'?150:['main_barcode','transfer_no'].includes(key)?200:5000;
  if(key==='system_no'&&!value)throw Error('客户单号不能为空');if(value.length>max)throw Error('内容最多'+max+'个字符');
  if(key==='system_no'&&editor.rows.some((r,n)=>n!==index&&r.system_no===value))throw Error('客户单号已存在，请勿重复');
 }
 if(piece>=0){if(piece>=Number(row.expected))throw Error('件号超过预报件数');row.pieces=row.pieces||[];while(row.pieces.length<=piece)row.pieces.push({weight:null,length:null,width:null,height:null});row.pieces[piece][key]=value}else row[key]=value;
 if(piece>=0||key==='expected'){
  const ps=row.pieces||[];row.weight=ps.length===Number(row.expected)&&ps.every(p=>p.weight!==null&&p.weight!==undefined&&p.weight!=='')?ps.reduce((sum,p)=>sum+Number(p.weight),0):null;
  for(const k of ['length','width','height'])row[k]=Number(row.expected)===1?(ps[0]?.[k]??null):null;
 }
 dirty=true;
}
function beginCellEdit(cell,index,key,piece=-1){
 if(busy||!canEditDraft('editor'))return;if(activeCellEdit?.cell===cell)return;
 if(activeCellEdit&&!activeCellEdit.finish(false))return;
 const row=editor.rows[index];if(!row)return;
 const original=piece>=0?row.pieces?.[piece]?.[key]:row[key];
 const input=document.createElement('input');input.value=original??'';input.type='text';
 if(piece>=0||key==='declared_value'||key==='expected')input.inputMode='decimal';
 input.setAttribute('aria-label',piece>=0?'第'+(piece+1)+'件 '+key:draftFields[key]);
 input.className='cell-input';cell.replaceChildren(input);
 let done=false;
 const finish=(cancel=false)=>{
  if(done)return true;if(!cancel){try{changeDraftValue(index,key,piece,input.value)}catch(e){toast(e.message);input.setAttribute('aria-invalid','true');input.focus();return false}}
  done=true;activeCellEdit=null;
  cell.textContent=cancel?(original===null||original===undefined||original===''?'双击填写':String(original)):(piece>=0?editor.rows[index].pieces[piece][key]:editor.rows[index][key])??'双击填写';
  if(!cancel){
   // Patch matching cells without removing the Save/Submit button during blur.
   document.querySelectorAll('[data-draft-row="'+index+'"][data-draft-key="'+key+'"][data-draft-piece="'+piece+'"]').forEach(target=>{target.textContent=cell.textContent;if(key==='remark')target.style.color=String(cell.textContent).includes('扣货')?'#b42318':''});
   if(key==='expected'&&detailDraftIndex!==null)showGoods('editor',detailDraftIndex);
  }
  return true;
 };
 activeCellEdit={cell,input,finish};input.addEventListener('dblclick',e=>e.stopPropagation());
 input.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();finish()}if(e.key==='Escape'){e.preventDefault();finish(true)}});
 input.addEventListener('blur',()=>finish());input.focus();input.select();
}

function wmsUniqueHex(){
 if(!window.crypto||!window.crypto.getRandomValues)throw Error('浏览器不支持安全生成编号，请更新浏览器');
 const bytes=new Uint8Array(16);window.crypto.getRandomValues(bytes);
 return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
}
function wmsRequestId(){return wmsUniqueHex();}
let qrBatch=[];
function qrModel(code){const qr=qrcode(0,'M');qr.addData(code,'Byte');qr.make();return qr;}
function qrLabelMark(i){return 'AFG-'+(qrBatch[0]||'').slice(-6)+'-'+String(i+1).padStart(3,'0');}
function qrLabelHtml(code,i,buttons=true){
 const svg=qrModel(code).createSvgTag({cellSize:4,margin:16,scalable:true});
 return '<div class="qrLabel"><strong class="qrMark">'+qrLabelMark(i)+'</strong>'+svg+'<b>'+esc(code.slice(-8))+'</b>'+'<code>'+esc(code)+'</code>'+(buttons?'<button class="secondary" onclick="downloadQrPng('+i+')">下载图片</button>':'')+'</div>';
}
function renderQrBatch(){

function generateQrBatch(){
 const count=Number($('qrBatchCount').value);
 if(!Number.isInteger(count)||count<1||count>300)return notice('请输入1至300的整数',true);
 if(qrBatch.length&&!confirm('生成新的二维码编号？请先下载或打印当前批次。'))return;
 try{
  const used=new Set(qrBatch),next=[];
  for(let i=0;i<count;i++){let code;do{code='afg-'+wmsUniqueHex();}while(used.has(code));used.add(code);next.push(code);}
  qrBatch=next;renderQrBatch();
  try{localStorage.setItem(clientQrStorageKey(),JSON.stringify(qrBatch));}catch(e){notice('本批已生成，但浏览器无法保存；请先下载打印文件',true);}
 }catch(e){notice(e.message,true);}
}
function saveQrFile(blob,name){
 if(!blob)return notice('导出失败，请重新下载');
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function downloadQrPng(i){
 const code=qrBatch[i];if(!code)return;
 const qr=qrModel(code),n=qr.getModuleCount(),scale=10,canvas=document.createElement('canvas');canvas.width=canvas.height=(n+8)*scale;
 const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#000';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect((c+4)*scale,(r+4)*scale,scale,scale);
 canvas.toBlob(blob=>blob?saveQrFile(blob,code+'.png'):notice('图片导出失败',true),'image/png');
}
function createQrBatchPdf(codes){
 // ASCII-only PDF with vector QR modules and built-in fonts; no online service is required.
 const objects=[null],mm=72/25.4,pageWidth=100*mm,pageHeight=150*mm;
 function object(body){objects.push(body);return objects.length-1;}
 const catalog=object(''),pages=object(''),font=object('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'),mono=object('<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>'),pageIds=[];
 function text(x,y,size,value,fontName='F1'){return 'BT /'+fontName+' '+size+' Tf 1 0 0 1 '+x.toFixed(3)+' '+y.toFixed(3)+' Tm ('+value.replace(/[\\()]/g,'\\$&')+') Tj ET\n';}
 const batch=(codes[0]||'').slice(-6),total=codes.length;
 for(let page=0;page<total;page++){
  const code=codes[page],mark='AFG-'+batch+'-'+String(page+1).padStart(3,'0');
  let stream='0 g\n'+text(8*mm,135*mm,32,'AFG')+text(8*mm,125*mm,15,mark);
  stream+='0 G 0.6 w '+(8*mm).toFixed(3)+' '+(120*mm).toFixed(3)+' m '+(92*mm).toFixed(3)+' '+(120*mm).toFixed(3)+' l S\n';
  const qr=qrModel(code),n=qr.getModuleCount(),side=68*mm,unit=side/(n+8),qx=16*mm,qy=45*mm;
  // Keep a four-module quiet zone and place all text outside the QR symbol.
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))stream+=(qx+(c+4)*unit).toFixed(4)+' '+(qy+(n+3-r)*unit).toFixed(4)+' '+unit.toFixed(4)+' '+unit.toFixed(4)+' re f\n';
  stream+=text(8*mm,33*mm,22,code.slice(-8));
  stream+=text(8*mm,23*mm,9,code.slice(0,20),'F2')+text(8*mm,18*mm,9,code.slice(20),'F2');
  stream+=text(8*mm,7*mm,8,'LABEL '+(page+1)+' / '+total+'  |  100 x 150 mm');
  const contents=object('<< /Length '+stream.length+' >>\nstream\n'+stream+'endstream');
  pageIds.push(object('<< /Type /Page /Parent '+pages+' 0 R /MediaBox [0 0 '+pageWidth.toFixed(3)+' '+pageHeight.toFixed(3)+'] /Resources << /Font << /F1 '+font+' 0 R /F2 '+mono+' 0 R >> >> /Contents '+contents+' 0 R >>'));
 }
 objects[catalog]='<< /Type /Catalog /Pages '+pages+' 0 R >>';
 objects[pages]='<< /Type /Pages /Count '+pageIds.length+' /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] >>';
 let pdf='%PDF-1.4\n',offsets=[0];
 for(let i=1;i<objects.length;i++){offsets.push(pdf.length);pdf+=i+' 0 obj\n'+objects[i]+'\nendobj\n';}
 const xref=pdf.length;pdf+='xref\n0 '+objects.length+'\n0000000000 65535 f \n';
 for(let i=1;i<objects.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
 pdf+='trailer\n<< /Size '+objects.length+' /Root '+catalog+' 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
 return new Blob([pdf],{type:'application/pdf'});
}
function downloadQrBatch(){

}

function toggleUiMenu(open){document.body.classList.toggle('ui-menu-open',open===undefined?!document.body.classList.contains('ui-menu-open'):open)}
function toneForStatus(value){const t=String(value).trim();if(t.includes('扣货')||t.includes('扣件'))return 'red';if(t.includes('破损')&&!t.includes('无破损')&&!t.includes('已修复'))return 'orange';if(t==='全部出库'||t==='全部入库'||t.startsWith('已出库')||t==='已修复'||t==='无破损'||t==='已关闭')return 'green';if(t.startsWith('入库中')||t.startsWith('出库中')||t.startsWith('已入库')||t.startsWith('待出库')||t.startsWith('重出')||t==='作业中')return 'blue';if(t.startsWith('退回')||t==='草稿')return 'orange';return 'gray'}
function decorateUiStatuses(root){
 const allowed=/^(?:已预报|全部入库|全部出库|入库中|出库中|退回待处理：\d+件|待入库|已入库|待出库|已出库|待扣件|扣件|退回|重出|预报|已关闭|作业中|无破损|有破损|已修复)(?:[（(].*[）)])?$/;

}

</script><script id="aifuge-v2-presentation">
/* Presentation metadata only. No existing events, API calls, values or text are changed. */
(()=>{
 function labelTables(){
  document.querySelectorAll('table').forEach(table=>{
   if(table.closest('.qrLabel'))return;
   const rows=Array.from(table.querySelectorAll('tr')).filter(row=>row.closest('table')===table);
   const heading=rows.find(row=>row.querySelector('th'));
   if(!heading)return;
   const labels=Array.from(heading.querySelectorAll('th')).map(th=>th.textContent.trim());
   if(!table.classList.contains('ui-responsive-table'))table.classList.add('ui-responsive-table');if(!heading.classList.contains('ui-mobile-heading'))heading.classList.add('ui-mobile-heading');
   if(labels.length===2&&labels[0]==='项目'&&labels[1]==='内容')table.classList.add('ui-kv-table');
   rows.forEach(row=>{
    if(row===heading)return;
    const cells=Array.from(row.children).filter(cell=>cell.tagName==='TD');
    cells.forEach((cell,index)=>{
     if(cell.colSpan>1){cell.classList.add('ui-mobile-span');return}
     cell.setAttribute('data-ui-cell-label',labels[index]||'');
     if(labels[index]==='操作'||(index===cells.length-1&&cell.querySelector('button')&&cells.length>2))cell.classList.add('ui-mobile-actions');
    });
   });
  });
 }
 let queued=false;
 const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;labelTables()})};
 labelTables();new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});
})();

</script></body></html>
